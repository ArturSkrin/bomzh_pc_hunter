[project]
name = "baraholka"
version = "0.1.0"
description = "Ищет дешёвое компьютерное железо на румынских барахолках и помогает торговаться"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3",
    "litellm>=1.40",
    "python-dotenv>=1.0",
    "playwright>=1.45",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
baraholka = "baraholka.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
baraholka = ["templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
