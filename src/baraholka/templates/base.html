<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Барахолка — {% block title %}{% endblock %}</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --fg:#1d1d1b; --muted:#6b6b66; --line:#e2e2dc; --accent:#2f6f4f; --warn:#a33; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --card:#1f1f1d; --fg:#ecece8; --muted:#9a9a93; --line:#33332f; --accent:#6fbf94; --warn:#e07070; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui, sans-serif; }
  nav { display:flex; flex-wrap:wrap; gap:6px 18px; align-items:center; padding:12px 20px; border-bottom:1px solid var(--line); background:var(--card); }
  nav b { margin-right:12px; }
  nav a { color:var(--muted); text-decoration:none; }
  nav a.on { color:var(--fg); font-weight:600; }
  main { max-width:1200px; margin:0 auto; padding:20px; }
  a { color:var(--accent); }
  input, select, textarea, button { font:inherit; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:6px; padding:6px 10px; }
  button { cursor:pointer; }
  button.primary { background:var(--accent); color:var(--bg); border-color:var(--accent); }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-weight:600; color:var(--muted); font-size:13px; }
  .muted { color:var(--muted); font-size:13px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; border:1px solid var(--line); font-size:12px; color:var(--muted); }
  .free { color:var(--accent); font-weight:700; }
  .err { color:var(--warn); }
  img.thumb { width:96px; height:72px; object-fit:cover; border-radius:4px; background:var(--line); }
  form.inline { display:inline; }
  th a.sort { color:inherit; text-decoration:none; }
  .score { display:inline-block; padding:1px 7px; border-radius:99px; font-size:13px; font-weight:700; background:var(--line); }
  .score.s7, .score.s8, .score.s9, .score.s10 { background:var(--accent); color:var(--bg); }
  .score.s0, .score.s1, .score.s2, .score.s3 { color:var(--muted); font-weight:400; }
  th a.sort.on { color:var(--fg); }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .seg a { padding:6px 12px; text-decoration:none; color:var(--muted); background:var(--card); }
  .seg a.on { background:var(--accent); color:var(--bg); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; display:flex; flex-direction:column; }
  /* overflow:hidden — иначе высокое фото растягивает карточку мимо 4:3 */
  .card .ph { display:flex; align-items:center; justify-content:center; aspect-ratio:4/3; overflow:hidden; background:var(--line); }
  .card .ph img { width:100%; height:100%; object-fit:cover; }
  .card .cb { padding:10px 12px; display:flex; flex-direction:column; gap:4px; flex:1; }
  .card .price { font-size:18px; font-weight:700; }
  .card .t { color:var(--fg); text-decoration:none; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card .foot { margin-top:auto; padding-top:6px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
</style>
</head>
<body>
<nav>
  <b>🧰 Барахолка</b>
  <a href="{{ url_for('search') }}" class="{{ 'on' if request.endpoint == 'search' }}">Поиск</a>
  <a href="{{ url_for('listings') }}" class="{{ 'on' if request.endpoint == 'listings' }}">Объявления</a>
  <a href="{{ url_for('queries') }}" class="{{ 'on' if request.endpoint == 'queries' }}">Поисковые запросы</a>
  <a href="{{ url_for('settings') }}" class="{{ 'on' if request.endpoint == 'settings' }}">Настройки и LLM</a>
</nav>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
